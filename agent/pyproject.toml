[project]
name = "returns-manager"
version = "0.1.0"
description = "Returns Manager (Cube Buildathon 04): evidence-backed identity, completeness, condition and disposition for returned units."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.0",
    "pymupdf==1.25.3",
    "python-ulid==4.0.1",
    "pyyaml==6.0.3",
    "rfc8785==0.1.4",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "typer==0.27.2",
    "uvicorn==0.53.0",
]

[project.scripts]
returns-manager = "returns_manager.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returns_manager"]

[dependency-groups]
dev = [
    "hypothesis==6.168.1",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT", "ASYNC"]
ignore = [
  "S101",  # assert is the pytest idiom
]

[tool.ruff.lint.flake8-bugbear]
# typer.Option / typer.Argument in defaults are Typer's documented idiom.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
"src/returns_manager/reference/extract.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["returns_manager"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# Strict where correctness is load-bearing (build prompt §4.1).
[[tool.mypy.overrides]]
module = [
  "returns_manager.judgment.*",
  "returns_manager.disposition.*",
  "returns_manager.evidence.*",
  "returns_manager.canonical.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
  "live: calls the real Gemini API and spends free-tier quota (opt-in: -m live)",
  "db: needs the local Supabase stack (supabase start) and a migrated database",
]
